<!doctype html>
<html lang="es">
<head>
<meta name="robots" content="noindex, nofollow">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Casa Wuehrer · 360</title>
<!-- Visor VIRTU v1, etapa E3 (PRB-0002, 7-nov-2026): recorrido 360. Lee tour360.json (lo escribe fichas/interactivo/visor_virtu_v1/preparar_360.py).
     Puntos "pases": mezcla de pases de luz V-Ray en el navegador (shader del prototipo tour_v0 de PI1, sin cambios en la formula), con dia/noche y luces.
     Puntos "fijo": un 360 V-Ray de dia. Saltos por la planta y por marcas en el piso. three.js 0.160.0 fijo (jsdelivr), como el resto del visor. -->
<style>
:root { --papel:#F2EDE5; --panel:rgba(242,237,229,.94); --tinta:#1E1C1A; --gris:#7D776F; --linea:#D6CDBF; --terra:#9A5A2E; }
* { box-sizing:border-box; }
html, body { margin:0; height:100%; overflow:hidden; background:#111; color:var(--tinta); font:13px/1.4 "Segoe UI", system-ui, -apple-system, "Helvetica Neue", Arial, sans-serif; }
#vista { position:fixed; inset:0; touch-action:none; cursor:grab; display:block; width:100%; height:100%; }
.caja { background:var(--panel); border:1px solid var(--linea); box-shadow:0 2px 12px rgba(0,0,0,.18); }
button { font:inherit; border:1px solid var(--linea); background:#fff; color:var(--tinta); border-radius:16px; padding:5px 12px; cursor:pointer; white-space:nowrap; }
button.on { background:var(--tinta); color:#fff; border-color:var(--tinta); } button:disabled { opacity:.38; cursor:default; }
#cab { position:fixed; left:10px; top:10px; border-radius:12px; padding:8px 12px; max-width:min(520px, calc(100% - 20px)); }
#cab b { font-size:15px; } #cab .nota { font-size:11.5px; color:var(--gris); margin-top:2px; }
#estados { position:fixed; left:10px; right:10px; bottom:14px; width:fit-content; margin:0 auto; display:flex; gap:6px; align-items:center; border-radius:28px; padding:6px 8px; flex-wrap:wrap; justify-content:center; max-width:calc(100% - 20px); }
#estados .et { font-size:11px; color:var(--gris); margin:0 2px 0 6px; } #estados .sep { width:1px; height:22px; background:var(--linea); }
#estados .acc { background:var(--terra); color:#fff; border-color:var(--terra); }
/* E9: planta del panel. Medidas fijas en pixeles para que los nombres se lean igual en cualquier pantalla: si no cabe, se desliza de lado */
#plano { position:fixed; right:10px; top:10px; border-radius:12px; padding:5px 6px; background:#fff; max-width:calc(100% - 20px); }
#pl-marco { overflow-x:auto; overflow-y:hidden; scrollbar-width:none; }
#pl-marco::-webkit-scrollbar { display:none; }
#splano { display:block; }
#splano text { font:500 9.5px/1 "Segoe UI", system-ui, -apple-system, "Helvetica Neue", Arial, sans-serif; fill:#26231F; text-anchor:middle; dominant-baseline:central; paint-order:stroke; stroke:#fff; stroke-width:2.6px; stroke-linejoin:round; pointer-events:none; }
#splano text.ext { font-size:10px; text-anchor:start; fill:#3F3B36; }
#splano .n { font-size:9px; font-weight:600; fill:#5F5A53; }
.ppt { cursor:pointer; outline:none; } .ppt .h { fill:transparent; }
.ppt .d { fill:#fff; stroke:#26231F; stroke-width:1.5px; transition:r .12s; }
.ppt:hover .d, .ppt:focus-visible .d { fill:#26231F; }
.ppt.on .d { fill:var(--terra); stroke:#fff; stroke-width:1.8px; }
#cono { fill:rgba(154,90,46,.26); stroke:var(--terra); stroke-width:1px; stroke-linejoin:round; pointer-events:none; }
/* E9b (Pipe, 8-nov: «Prefiero que se vean miniaturas en circulos en la parte inferior»): fila sobre la barra de estados; el nombre, al pasar el cursor (arriba) y bajo el activo */
#mini { position:fixed; left:0; right:0; bottom:58px; overflow-x:auto; overflow-y:hidden; scrollbar-width:none; pointer-events:none; }
#mini::-webkit-scrollbar { display:none; }
#mini-fila { display:flex; width:max-content; margin:0 auto; padding:30px 90px 25px; gap:clamp(14px, 3vw, 44px); }
.mn, .mn.on { position:relative; flex:none; width:64px; height:64px; padding:0; border-radius:50%; background:#2A2826; border:2.5px solid #fff; box-shadow:0 1px 8px rgba(0,0,0,.45); pointer-events:auto; touch-action:pan-x; transition:transform .12s; }
.mn img { display:block; width:100%; height:100%; object-fit:cover; border-radius:50%; }
.mn.on { border-color:var(--terra); box-shadow:0 0 0 2px #fff, 0 1px 8px rgba(0,0,0,.45); }
.mn .nom { display:none; position:absolute; left:50%; bottom:calc(100% + 6px); transform:translateX(-50%); font-size:11.5px; line-height:1.5; color:#fff; background:rgba(30,28,26,.82); padding:0 8px; border-radius:8px; white-space:nowrap; }
.mn.on .nom { display:block; top:calc(100% + 6px); bottom:auto; background:var(--terra); }
.mn:focus-visible { outline:2px solid #fff; outline-offset:2px; }
@media (hover:hover) { .mn:hover { transform:scale(1.07); } .mn:hover .nom { display:block; } }
@media (min-width:761px) and (max-width:1199px) { #cab { max-width:calc(100% - 660px); } #cab .nota { display:none; } }
#etiquetas { position:fixed; inset:0; pointer-events:none; }
.salto { position:absolute; transform:translate(-50%, -50%); pointer-events:auto; cursor:pointer; text-align:center; }
.salto .anillo { width:34px; height:34px; border-radius:50%; border:3px solid #fff; background:rgba(154,90,46,.55); box-shadow:0 0 0 1px rgba(0,0,0,.25), 0 2px 8px rgba(0,0,0,.35); margin:0 auto; transition:transform .15s; }
.salto:hover .anillo { transform:scale(1.15); background:rgba(154,90,46,.85); }
.salto span { display:inline-block; margin-top:4px; font-size:11.5px; color:#fff; background:rgba(30,28,26,.72); padding:1px 7px; border-radius:8px; white-space:nowrap; }
#carga { position:fixed; inset:0; display:grid; place-items:center; color:#ddd; background:#111; font-size:13px; }
#fundido { position:fixed; inset:0; background:#000; opacity:0; pointer-events:none; transition:opacity .25s; }
@media (max-width:760px) {
  #plano { left:8px; right:8px; top:48px; padding:4px; max-width:none; }
  #cab { top:8px; left:8px; max-width:calc(100% - 16px); padding:6px 10px; } #cab b { font-size:13px; }
  #cab .nota { display:none; }
  #estados { left:4px; right:4px; max-width:none; bottom:8px; gap:4px; padding:5px 6px; } #estados .et, #estados .sep, #estados .solo-escritorio { display:none; }
  #estados button { padding:5px 10px; font-size:12px; }
  #mini { bottom:40px; } #mini-fila { gap:14px; padding:26px 90px 23px; } .mn, .mn.on { width:52px; height:52px; } .mn .nom { font-size:11px; }
  .salto .anillo { width:28px; height:28px; } .salto span { font-size:10.5px; }
}
@media (min-width:761px) and (max-height:440px) {     /* celular acostado: no cabe la planta; se navega por los circulos */
  #plano, #cab .nota, #estados .et, #estados .sep, #estados .solo-escritorio { display:none; }
  #estados { bottom:8px; gap:4px; padding:5px 6px; } #estados button { padding:5px 10px; font-size:12px; }
  #mini { bottom:40px; } #mini-fila { gap:14px; padding:26px 90px 23px; } .mn, .mn.on { width:52px; height:52px; } .mn .nom { font-size:11px; }
  #cab { padding:6px 10px; max-width:calc(100% - 20px); }
}
</style>
</head>
<body>
<canvas id="vista"></canvas>
<div id="etiquetas"></div>
<div id="fundido"></div>
<div id="cab" class="caja"><b id="t-nombre">—</b><div class="nota" id="t-nota"></div></div>
<div id="mini"><div id="mini-fila"></div></div>
<div id="plano" class="caja"><div id="pl-marco"><svg id="splano" xmlns="http://www.w3.org/2000/svg" role="group" aria-label="Planta de la casa con los puntos del recorrido"></svg></div></div>
<div id="estados" class="caja">
  <span class="et">Hora</span><button data-k="hora" data-v="dia">Día</button><button data-k="hora" data-v="noche">Noche</button>
  <span class="sep"></span>
  <span class="et">Luces</span><button data-k="luces" data-v="1">Encendidas</button><button data-k="luces" data-v="0">Apagadas</button>
  <span class="sep"></span>
  <span class="et">Persiana</span><button class="solo-escritorio" disabled title="Por ahora todos los 360 son con la persiana recogida (Pipe: «Recogida en todos»)">Recogida</button>
  <span class="sep"></span>
  <button id="b-3d" class="acc" title="Caminar en el 3D desde este punto">Ver en 3D</button>
</div>
<div id="carga">cargando el recorrido…</div>
<script type="module">
import * as THREE from 'https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js';
const $ = s => document.querySelector(s);
const T3 = window.T3 = { listo: false };
const t0 = performance.now();
// E3b (Pipe, 8-nov: «integremos los ultimos 360 en 4k al visor»): los 10 puntos a 4096 px (preparar_360_4k.py). ?tour=v1 vuelve al recorrido de 2000 px; ?res=2k o ?res=4k fuerzan la resolucion
const QS = new URLSearchParams(location.search);
const tour = await (await fetch(QS.get('tour') === 'v1' ? 'tour360.json' : 'tour360_4k.json')).json();
const PUNTOS = tour.puntos.filter(p => p.tipo !== 'falta');
for (const p of PUNTOS) p.nombre = p.nombre.replace(/bano/, 'baño').replace(/cesped/, 'césped').replace(/vestibulo/, 'vestíbulo').replace(/sofa/, 'sofá');   // la ficha va sin tildes; a la vista, con ellas
const est = { hora: 'dia', luces: '1', punto: null };
function avisarPadre(m) { if (parent !== window) parent.postMessage(m, location.origin); }

// ---------------------------------------------------------------- render
const lienzo = $('#vista');
const ren = new THREE.WebGLRenderer({ canvas: lienzo, antialias: false, preserveDrawingBuffer: true });
ren.setPixelRatio(Math.min(devicePixelRatio, 2));
ren.outputColorSpace = THREE.LinearSRGBColorSpace;   // la mezcla y la gamma se hacen en el shader (como tour_v0 de PI1)
const escena = new THREE.Scene(), cam = new THREE.PerspectiveCamera(75, 1, 0.1, 50);
const carg = new THREE.TextureLoader(), cache = {};
function tex(ruta) {
  if (!cache[ruta]) cache[ruta] = new Promise((ok, mal) => carg.load(ruta, t => { t.colorSpace = THREE.NoColorSpace; t.generateMipmaps = false;
    t.minFilter = THREE.LinearFilter; t.magFilter = THREE.LinearFilter; ok(t); }, undefined, mal));
  return cache[ruta];
}
// 4K: primero la version de 2048 px (al instante), luego la de 4096 con mipmaps. En celulares se queda en 2048 (pantalla chica, memoria justa).
// Solo se guardan los ultimos 3 panoramas 4K en la tarjeta: cada uno ocupa unos 45 MB de memoria grafica.
const USA4K = QS.get('res') === '4k' || (QS.get('res') !== '2k' && ren.capabilities.maxTextureSize >= 4096 && !(matchMedia('(pointer: coarse)').matches && Math.min(screen.width, screen.height) < 600));
const cache4k = new Map(); let ficha4k = 0;
function tex4k(ruta) {
  if (cache4k.has(ruta)) { const v = cache4k.get(ruta); cache4k.delete(ruta); cache4k.set(ruta, v); return v; }
  const v = new Promise((ok, mal) => carg.load(ruta, t => { t.colorSpace = THREE.NoColorSpace; t.generateMipmaps = true; t.minFilter = THREE.LinearMipmapLinearFilter; t.magFilter = THREE.LinearFilter; ok(t); }, undefined, mal));
  cache4k.set(ruta, v);
  while (cache4k.size > 3) { const [k, viejo] = cache4k.entries().next().value; cache4k.delete(k); viejo.then(t => t.dispose()); }
  return v;
}
function pedir4k(p) { T3.res = '2k'; if (!p.imagen_2k || !USA4K) return; const tok = ficha4k; tex4k(p.imagen).then(t => { if (tok === ficha4k) { uni.t_fijo.value = t; T3.res = '4k'; } }); }
// shader de PI1 (tour_v0): suma lineal de pases guardados como (x/escala)^(1/2,2); cielo por la mascara alfa. "fijo" = una imagen sola.
const PASES = ['sol', 'ent', 'int_d', 'int_n', 'si_int', 'si_ext', 'alfa', 'fijo'];
const uni = { gamma: { value: 2.2 }, expo: { value: 1.0 }, cieloD: { value: null }, cieloN: { value: null }, offD: { value: 0 }, offN: { value: 0 }, signo: { value: 1 },
  fijoOn: { value: 1 }, kCieloD: { value: 0 }, kCieloN: { value: 0 } };
for (const p of PASES) { uni['t_' + p] = { value: null }; uni['s_' + p] = { value: 1 }; uni['k_' + p] = { value: new THREE.Vector3() }; }
const frag = `precision highp float; varying vec2 vUv;
uniform float gamma, expo, offD, offN, signo, fijoOn, kCieloD, kCieloN; uniform sampler2D cieloD, cieloN;
${PASES.map(p => `uniform sampler2D t_${p}; uniform float s_${p}; uniform vec3 k_${p};`).join('\n')}
vec3 lin(sampler2D t, float s) { return pow(texture2D(t, vUv).rgb, vec3(gamma)) * s; }
void main() { vec3 c;
  if (fijoOn > 0.5) { c = lin(t_fijo, 1.0); }
  else { c = k_sol * lin(t_sol, s_sol) + k_ent * lin(t_ent, s_ent) + k_int_d * lin(t_int_d, s_int_d) + k_int_n * lin(t_int_n, s_int_n)
      + k_si_int * lin(t_si_int, s_si_int) + k_si_ext * lin(t_si_ext, s_si_ext);
    float a = texture2D(t_alfa, vUv).r; float u = fract(signo * vUv.x + offD); float un = fract(signo * vUv.x + offN);
    vec3 cd = pow(texture2D(cieloD, vec2(u, vUv.y)).rgb, vec3(2.2)); vec3 cn = pow(texture2D(cieloN, vec2(un, vUv.y)).rgb, vec3(2.2));
    c += (1.0 - a) * (kCieloD * cd + kCieloN * cn); }
  gl_FragColor = vec4(pow(clamp(c * expo, 0.0, 1.0), vec3(1.0 / 2.2)), 1.0); }`;
const vert = `varying vec2 vUv; void main() { vUv = uv; gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0); }`;
const geo = new THREE.SphereGeometry(10, 96, 48); geo.scale(-1, 1, 1);
escena.add(new THREE.Mesh(geo, new THREE.ShaderMaterial({ uniforms: uni, vertexShader: vert, fragmentShader: frag })));
const tours = {};      // tour.json de PI1 por carpeta
async function tourPI1(dir) { if (!tours[dir]) tours[dir] = fetch(dir + 'tour.json').then(r => r.json()); return tours[dir]; }

// ---------------------------------------------------------------- vista: lon 180 = centro del panorama = hacia donde mira la camara de V-Ray
let lon = 180, lat = 0, fov = 75, arr = null;
lienzo.addEventListener('pointerdown', e => { arr = [e.clientX, e.clientY, lon, lat]; lienzo.setPointerCapture(e.pointerId); lienzo.style.cursor = 'grabbing'; });
lienzo.addEventListener('pointermove', e => { if (!arr) return; const f = fov / lienzo.clientHeight; lon = arr[2] - (e.clientX - arr[0]) * f; lat = Math.max(-85, Math.min(85, arr[3] + (e.clientY - arr[1]) * f)); });
lienzo.addEventListener('pointerup', () => { arr = null; lienzo.style.cursor = 'grab'; });
lienzo.addEventListener('wheel', e => { fov = Math.max(30, Math.min(100, fov + e.deltaY * 0.05)); e.preventDefault(); }, { passive: false });
function rumbo() { return ((est.punto.mira_az + (lon - 180)) % 360 + 360) % 360; }      // rumbo de la vista (0 norte, 90 este)
function dirDe(az, elev) {          // direccion en la esfera para un rumbo de planta y una elevacion
  const L = THREE.MathUtils.degToRad(180 + az - est.punto.mira_az), e = THREE.MathUtils.degToRad(elev);
  return new THREE.Vector3(Math.cos(L) * Math.cos(e), Math.sin(e), Math.sin(L) * Math.cos(e));
}

// ---------------------------------------------------------------- estados y puntos
async function ponerPunto(clave, sinFundido) {
  const p = PUNTOS.find(x => x.clave === clave) || PUNTOS[0];
  if (!sinFundido && est.punto) { $('#fundido').style.opacity = 1; await new Promise(r => setTimeout(r, 220)); }
  const rumboAnterior = est.punto ? rumbo() : null;
  est.punto = p;
  if (p.tipo === 'pases') {
    const t = await tourPI1(p.tour); const P = t.puntos.find(x => x.clave === p.clave); const G = P.geometrias[0];
    const lista = Object.entries(G.pases); const ts = await Promise.all(lista.map(([k, d]) => tex(p.tour + G.dir + d.archivo)));
    lista.forEach(([k, d], i) => { uni['t_' + k].value = ts[i]; uni['s_' + k].value = d.escala; });
    const [cd, cn] = await Promise.all([tex(p.tour + t.cielo.dia), tex(p.tour + t.cielo.noche)]); cd.wrapS = cn.wrapS = THREE.RepeatWrapping;
    uni.cieloD.value = cd; uni.cieloN.value = cn; uni.offD.value = t.cielo.offD; uni.offN.value = t.cielo.offN; uni.signo.value = t.cielo.signo;
    uni.fijoOn.value = 0; T3.mezclas = t.mezclas;
  } else { ficha4k++; uni.t_fijo.value = await tex(p.imagen_2k || p.imagen); uni.fijoOn.value = 1; pedir4k(p); }
  // al saltar se conserva hacia donde se miraba
  lon = rumboAnterior === null ? 180 : 180 + rumboAnterior - p.mira_az;
  $('#t-nombre').textContent = p.nombre; $('#t-nota').textContent = p.nota + (p.tipo === 'fijo' ? ' · noche y luces llegan con los pases de PI1' : '');
  marcarMini(p.clave); marcarPlano();
  await aplicar(); armarSaltos(); $('#fundido').style.opacity = 0;
  history.replaceState(null, '', '#' + p.clave); avisarPadre({ virtu: 'punto360', clave: p.clave });
}
async function aplicar() {
  const p = est.punto, conPases = p && p.tipo === 'pases';
  document.querySelectorAll('#estados button[data-k]').forEach(b => { b.disabled = !conPases; b.classList.toggle('on', est[b.dataset.k] === b.dataset.v && conPases); });
  if (!conPases) return;
  const m = T3.mezclas[est.hora + (est.luces === '1' ? '+' : '-')];
  for (const k of PASES) { const v = m[k] || [0, 0, 0]; uni['k_' + k].value.set(v[0], v[1], v[2]); }
  uni.kCieloD.value = m.cieloD || 0; uni.kCieloN.value = m.cieloN || 0; uni.expo.value = m.expo || 1;
  // de dia y con luces, el punto con pases muestra el V-Ray 4K; noche y luces apagadas son la mezcla de pases de PI1
  const tok = ++ficha4k;
  if (p.imagen_2k && est.hora === 'dia' && est.luces === '1') { const t = await tex(p.imagen_2k); if (tok === ficha4k) { uni.t_fijo.value = t; uni.fijoOn.value = 1; uni.expo.value = 1; pedir4k(p); } }
  else { uni.fijoOn.value = 0; T3.res = 'pases'; }
}
document.querySelectorAll('#estados button[data-k]').forEach(b => b.onclick = () => { est[b.dataset.k] = b.dataset.v; aplicar();
  avisarPadre({ virtu: 'estado', estado: { noche: est.hora === 'noche' } }); });
addEventListener('keydown', e => { if (!est.punto || est.punto.tipo !== 'pases') return;
  const m = { d: ['hora', 'dia'], n: ['hora', 'noche'], l: ['luces', est.luces === '1' ? '0' : '1'] }[e.key]; if (m) { est[m[0]] = m[1]; aplicar(); } });
$('#b-3d').onclick = () => { const p = est.punto; avisarPadre({ virtu: 'ir', modulo: '3d', pie: { x: p.pos[0], y: p.pos[1], az: rumbo() } }); };
addEventListener('message', ev => { if (ev.origin !== location.origin || !ev.data) return; const d = ev.data;
  if (d.virtu === 'punto360-abrir' && d.clave) ponerPunto(d.clave);
  if (d.virtu === 'estado360') { if (typeof d.noche === 'boolean') { est.hora = d.noche ? 'noche' : 'dia'; aplicar(); } } });

// ---------------------------------------------------------------- saltos: marcas en el piso hacia los otros puntos (hasta 9 m) y lista
const etq = $('#etiquetas'); let saltos = [];
function armarSaltos() {
  etq.innerHTML = ''; saltos = [];
  const p = est.punto;
  for (const q of PUNTOS) { if (q === p) continue;
    const dx = q.pos[0] - p.pos[0], dy = q.pos[1] - p.pos[1], dist = Math.hypot(dx, dy); if (dist > 9.5) continue;
    const az = (THREE.MathUtils.radToDeg(Math.atan2(dx, dy)) + 360) % 360;
    const elev = THREE.MathUtils.radToDeg(Math.atan2((q.piso_z || 0) - ((p.piso_z || 0) + (p.ojo || 1.6)), dist));
    const d = document.createElement('div'); d.className = 'salto'; d.innerHTML = `<div class="anillo"></div><span>${q.nombre}</span>`;
    d.onclick = () => ponerPunto(q.clave); etq.appendChild(d);
    saltos.push({ el: d, dir: dirDe(az, elev).multiplyScalar(5), clave: q.clave, az, dist: +dist.toFixed(1) });
  }
  T3.saltos = saltos.map(s => ({ clave: s.clave, az: +s.az.toFixed(1), dist: s.dist }));
}
const mini = $('#mini'), fila = $('#mini-fila'), MINI = new Map();
for (const q of PUNTOS) { const b = document.createElement('button'); b.className = 'mn'; b.dataset.c = q.clave; b.setAttribute('aria-label', 'Ir a ' + q.nombre);
  b.innerHTML = `<img src="${q.mini || ''}" alt=""><span class="nom">${q.nombre}</span>`; b.onclick = () => ponerPunto(q.clave); fila.appendChild(b); MINI.set(q.clave, b); }
mini.addEventListener('wheel', e => { if (mini.scrollWidth > mini.clientWidth) { mini.scrollLeft += e.deltaY || e.deltaX; e.preventDefault(); } }, { passive: false });
{ const barra = $('#estados'), pegar = () => { mini.style.bottom = (innerHeight - barra.getBoundingClientRect().top) + 'px'; }; new ResizeObserver(pegar).observe(barra); addEventListener('resize', pegar); pegar(); }   // la fila siempre justo encima de la barra, aunque esta ocupe dos renglones
function marcarMini(c) { for (const [k, b] of MINI) b.classList.toggle('on', k === c); const b = MINI.get(c); mini.scrollTo({ left: b.offsetLeft + b.offsetWidth / 2 - mini.clientWidth / 2, behavior: 'smooth' }); }

// ---------------------------------------------------------------- planta (E9, Pipe 8-nov: «sencilla, no tiene tanto color, tiene el mobiliario y se puede distinguir cada espacio»)
// La imagen sale de las mallas del central (preparar_planta360.py). Norte a la derecha y oeste arriba, como G-02: asi la casa, larga, llena el panel.
// Un rumbo de planta es directamente el angulo en pantalla (0 = norte = derecha, 90 = este = abajo). Los puntos fuera de la casa van al margen oeste, con su distancia real escrita.
const svgNS = 'http://www.w3.org/2000/svg', KP = 17;           // px de pantalla por metro
const nodo = (tag, at = {}, padre) => { const e = document.createElementNS(svgNS, tag); for (const k in at) e.setAttribute(k, at[k]); if (padre) padre.appendChild(e); return e; };
const sv = $('#splano'), marco = $('#pl-marco'); const dibPl = await fetch('planta360/planta360_v3o.json').then(r => r.json());
const pV = dibPl.ventana, pX0 = pV.x0 - dibPl.margen_oeste_m + 0.4;   // el margen se mide desde el muro; la imagen ya trae 0,40 m por fuera
const aPx = (x, y) => [(y - pV.y0) * KP, (x - pX0) * KP];

{ const [ix, iy] = aPx(pV.x0, pV.y0); nodo('image', { href: 'planta360/' + dibPl.archivo, x: ix, y: iy, width: pW, height: (pV.x1 - pV.x0) * KP, preserveAspectRatio: 'none' }, sv); }

for (const r of dibPl.rotulos) { const [x, y] = aPx(r.x, r.y);
  const t = nodo('text', r.r ? { x, y, transform: `rotate(-90 ${x} ${y})` } : { x, y: r.t2 ? y - 6 : y }, sv); t.textContent = r.t; t.dataset.r = r.largo || r.t;
  if (r.t2) { const t2 = nodo('text', { x, y: y + 6 }, sv); t2.textContent = r.t2; t2.dataset.r = r.t + ' ' + r.t2; } }
{ const y = 11, x = pW - 26; nodo('path', { d: `M${x} ${y}h14m-4 -3.2l4 3.2l-4 3.2`, fill: 'none', stroke: '#5F5A53', 'stroke-width': 1.2, 'stroke-linecap': 'round', 'stroke-linejoin': 'round' }, sv); const n = nodo('text', { x: x - 8, y, class: 'n' }, sv); n.textContent = 'N'; }
const FLECHA = { piscina: '↖', pradera: '↑' }, NOMBRE_FUERA = { piscina: 'Piscina', pradera: 'Césped oeste' };
const PT_PL = new Map();
for (const q of PUNTOS) { const ex = dibPl.fuera[q.clave], [x, y] = ex ? aPx(ex.pin[0], ex.pin[1]) : aPx(q.pos[0], q.pos[1]);
  if (ex) { const t = nodo('text', { x: x + 11, y, class: 'ext' }, sv); t.textContent = `${FLECHA[q.clave] || ''} ${NOMBRE_FUERA[q.clave] || q.nombre} · ${ex.metros} m`; t.dataset.r = q.nombre; }
  const g = nodo('g', { class: 'ppt', 'data-c': q.clave, tabindex: 0, role: 'button', 'aria-label': 'Ir a ' + q.nombre }, sv);
  nodo('title', {}, g).textContent = q.nombre; nodo('circle', { class: 'h', cx: x, cy: y, r: 13 }, g); nodo('circle', { class: 'd', cx: x, cy: y, r: 4.3 }, g);
  g.addEventListener('click', () => ponerPunto(q.clave)); g.addEventListener('keydown', e => { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); ponerPunto(q.clave); } });
  PT_PL.set(q.clave, { g, x, y }); }
function marcarPlano() { for (const [c, o] of PT_PL) { const on = c === est.punto.clave; o.g.classList.toggle('on', on); o.g.querySelector('.d').setAttribute('r', on ? 6 : 4.3); if (on) { sv.appendChild(o.g); marco.scrollTo({ left: o.x - marco.clientWidth / 2, behavior: 'smooth' }); } } dibujarPlano(); }
let clavePl = '';

  const o = PT_PL.get(est.punto.clave), ab = Math.min(150, 2 * THREE.MathUtils.radToDeg(Math.atan(Math.tan(THREE.MathUtils.degToRad(fov / 2)) * innerWidth / innerHeight))), az = rumbo();
  const k = `${est.punto.clave}|${az.toFixed(1)}|${ab.toFixed(1)}`; if (k === clavePl) return; clavePl = k;
  const R = dibPl.fuera[est.punto.clave] ? 13 : 36, p = g => [o.x + R * Math.cos(THREE.MathUtils.degToRad(g)), o.y + R * Math.sin(THREE.MathUtils.degToRad(g))], a = p(az - ab / 2), b = p(az + ab / 2);
  cono.setAttribute('d', `M${o.x.toFixed(1)} ${o.y.toFixed(1)}L${a[0].toFixed(1)} ${a[1].toFixed(1)}A${R} ${R} 0 ${ab > 180 ? 1 : 0} 1 ${b[0].toFixed(1)} ${b[1].toFixed(1)}Z`);
  T3.plano = { az: +az.toFixed(1), abertura: +ab.toFixed(1) };
}

// ---------------------------------------------------------------- bucle
function tam() { const w = innerWidth, h = innerHeight; ren.setSize(w, h, false); cam.aspect = w / h; cam.updateProjectionMatrix(); }
addEventListener('resize', tam); tam();
const v = new THREE.Vector3();
function dibujar() {
  const ph = THREE.MathUtils.degToRad(90 - lat), th = THREE.MathUtils.degToRad(lon);
  cam.fov = fov; cam.updateProjectionMatrix(); cam.lookAt(Math.sin(ph) * Math.cos(th), Math.cos(ph), Math.sin(ph) * Math.sin(th)); cam.updateMatrixWorld();
  ren.render(escena, cam);

    s.el.style.display = vis ? '' : 'none'; if (vis) { s.el.style.left = ((v.x + 1) / 2 * innerWidth) + 'px'; s.el.style.top = ((1 - v.y) / 2 * innerHeight) + 'px'; } }

}
(function bucle() { dibujar(); requestAnimationFrame(bucle); })();
T3.dibujar = dibujar; T3.ponerPunto = ponerPunto; T3.est = est; T3.vista = (l, a, f) => { if (l !== undefined) lon = l; if (a !== undefined) lat = a; if (f) fov = f; dibujar(); };
T3.rumbo = () => rumbo();
T3.medir = () => { dibujar(); const gl = ren.getContext(), w = gl.drawingBufferWidth, hh = gl.drawingBufferHeight, px = new Uint8Array(w * hh * 4);
  gl.readPixels(0, 0, w, hh, gl.RGBA, gl.UNSIGNED_BYTE, px); const s = [0, 0, 0]; for (let i = 0; i < px.length; i += 4) { s[0] += px[i]; s[1] += px[i + 1]; s[2] += px[i + 2]; }
  return s.map(x => Math.round(10 * x / (w * hh)) / 10); };

// ---------------------------------------------------------------- arranque: el punto de la direccion o el estar
const pedido = decodeURIComponent(location.hash.replace('#', ''));
const q = new URLSearchParams(location.search); if (q.get('noche') === '1') est.hora = 'noche';
await ponerPunto(PUNTOS.some(p => p.clave === pedido) ? pedido : (PUNTOS.find(p => p.tipo === 'pases') || PUNTOS[0]).clave, true);
$('#carga').remove(); T3.carga_ms = Math.round(performance.now() - t0); T3.listo = true;

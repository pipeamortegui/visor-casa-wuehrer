<!doctype html>

<head>

<title>Casa Wuehrer · 3D v3q de revisión</title>
<style>
  /* Visor VIRTU v1 (7-nov-2026): identidad VIRTU (papel, tinta, terracota), escenas abajo, capas en un panel "Capas y ajustes" plegado. */
  :root { --bg:#F2EDE5; --panel:rgba(242,237,229,.95); --tinta:#1E1C1A; --suave:#7D776F; --linea:#D6CDBF; --acento:#9A5A2E; }
  * { box-sizing:border-box; }
  html, body { margin:0; height:100%; background:var(--bg); color:var(--tinta); font:13px/1.4 "Segoe UI", system-ui, -apple-system, "Helvetica Neue", Arial, sans-serif; overflow:hidden; }
  #lienzo { position:fixed; inset:0; touch-action:none; }
  .caja { background:var(--panel); border:1px solid var(--linea); box-shadow:0 2px 12px rgba(30,28,26,.08); }
  #herr { position:fixed; top:10px; left:10px; display:flex; gap:5px; align-items:center; flex-wrap:wrap; border-radius:22px; padding:5px; max-width:calc(100% - 20px); }
  #herr .sep { width:1px; height:20px; background:var(--linea); margin:0 3px; }
  #panel { position:fixed; top:58px; left:10px; width:300px; max-height:calc(100% - 140px); overflow:auto; border-radius:10px; padding:4px 12px 10px; display:none; }
  #panel.abierto { display:block; }
  h2 { font-size:10.5px; letter-spacing:.08em; text-transform:uppercase; color:var(--acento); margin:12px 0 4px; font-weight:700; }
  h2:first-child { margin-top:8px; }
  .fila { display:flex; align-items:center; gap:6px; margin:3px 0; }
  .fila label { flex:1; cursor:pointer; } .fila .mb { color:var(--suave); font-size:10px; }
  .fila input[type=range] { width:90px; accent-color:var(--acento); } input[type=checkbox] { accent-color:var(--tinta); }
  .chip { width:10px; height:10px; border-radius:50%; display:inline-block; }
  .botones { display:flex; gap:6px; flex-wrap:wrap; }
  button { font:inherit; border:1px solid var(--linea); background:#fff; color:var(--tinta); border-radius:16px; padding:4px 11px; cursor:pointer; white-space:nowrap; }
  button:hover { border-color:var(--suave); }
  button.on { background:var(--tinta); color:#fff; border-color:var(--tinta); }
  select { font:inherit; }
  #escenas { position:fixed; left:50%; bottom:14px; transform:translateX(-50%); display:flex; gap:6px; border-radius:28px; padding:6px; max-width:calc(100% - 20px); overflow-x:auto; scrollbar-width:none; }
  #escenas button { padding:8px 16px; font-weight:600; font-size:13px; }
  #escenas button.on { background:var(--acento); border-color:var(--acento); color:#fff; }
  #escenas button small { font-weight:400; opacity:.8; }
  #ficha { position:fixed; right:10px; top:10px; width:310px; border-radius:10px; padding:10px 12px; display:none; }
  #ficha .t { display:flex; justify-content:space-between; align-items:center; font-size:10.5px; letter-spacing:.08em; text-transform:uppercase; color:var(--acento); font-weight:700; margin-bottom:4px; }
  #ficha .t button { border:none; background:none; font-size:16px; padding:0 4px; color:var(--suave); }
  #ficha table { width:100%; border-collapse:collapse; font-size:12px; } #ficha td { padding:2px 0; vertical-align:top; } #ficha td:first-child { color:var(--suave); width:86px; }
  #ficha a, .enlace { color:var(--acento); cursor:pointer; text-decoration:none; font-weight:600; }
  #planta { position:fixed; right:10px; bottom:10px; border-radius:10px; padding:6px; }
  #hud { position:fixed; left:10px; bottom:76px; background:rgba(30,28,26,.8); color:#F2EDE5; border-radius:6px; padding:5px 8px; font:11px/1.35 ui-monospace, Consolas, monospace; display:none; }
  #hud.ver { display:block; }
  #aviso { position:fixed; left:50%; top:62px; transform:translateX(-50%); max-width:min(560px, calc(100% - 20px)); border-radius:10px; padding:8px 12px; font-size:12px; text-align:center; opacity:0; transition:opacity .4s; pointer-events:none; }
  #aviso.ver { opacity:1; }
  #carga { position:fixed; inset:0; display:flex; align-items:center; justify-content:center; pointer-events:none; background:var(--bg); }
  #carga > div { padding:18px 22px; min-width:280px; border-radius:12px; }
  #carga .logo { font-weight:800; letter-spacing:.16em; font-size:20px; margin-bottom:8px; } #carga .logo i { font-style:normal; color:var(--acento); }
  #barra { height:4px; background:var(--linea); border-radius:2px; overflow:hidden; margin-top:10px; } #barra i { display:block; height:100%; width:0; background:var(--acento); transition:width .2s; }
  #mira { position:fixed; left:50%; top:50%; width:8px; height:8px; margin:-4px 0 0 -4px; border:1px solid #fff; border-radius:50%; box-shadow:0 0 2px #000; display:none; pointer-events:none; }
  .ayuda { color:var(--suave); font-size:11px; margin-top:4px; }
  body.noche { --panel:rgba(31,38,48,.92); --tinta:#F2EDE5; --suave:#A9A39A; --linea:#3A4452; }
  body.noche button { background:#2A3340; color:#F2EDE5; } body.noche button.on { background:#F2EDE5; color:#1E1C1A; }
  body.noche #escenas button.on { background:var(--acento); color:#fff; }
  #axo-lista, #axo-barra { display:none; }
  body.axo #herr, body.axo #escenas, body.axo #planta, body.axo #panel, body.axo #hud { display:none !important; }
  body.axo #axo-lista { display:block; position:fixed; left:10px; top:10px; bottom:84px; width:270px; overflow:auto; border-radius:10px; padding:4px 8px 8px; }
  body.axo #axo-barra { display:flex; position:fixed; left:290px; right:10px; width:max-content; max-width:calc(100% - 300px); margin:0 auto; bottom:14px; gap:6px; align-items:center; border-radius:26px; padding:6px 8px; flex-wrap:wrap; justify-content:center; }
  #axo-barra .grupo { display:flex; gap:4px; } #axo-barra .sep { width:1px; height:22px; background:var(--linea); }
  #axo-barra button.on { background:var(--tinta); color:#fff; border-color:var(--tinta); }
  #axo-barra label { display:flex; align-items:center; gap:6px; font-size:12px; color:var(--suave); } #axo-barra input[type=range] { width:110px; accent-color:var(--acento); }
  #axo-3d { background:var(--acento) !important; color:#fff !important; border-color:var(--acento) !important; }
  .ax { display:flex; gap:9px; align-items:center; padding:7px 8px; border-radius:8px; cursor:pointer; border:1px solid transparent; }
  .ax:hover { background:rgba(0,0,0,.04); } .ax.on { background:#fff; border-color:var(--linea); }
  .ax .pt { width:11px; height:11px; border-radius:50%; flex:none; } .ax b { display:block; font-size:12.5px; } .ax small { color:var(--suave); font-size:11px; }
  @media (max-width:700px) {
    body.axo #axo-lista { left:8px; right:8px; top:8px; bottom:auto; width:auto; height:auto; overflow-x:auto; overflow-y:hidden; padding:5px; }
    body.axo #axo-lista h2 { display:none; } #axo-items { display:flex; gap:4px; } .ax { flex:none; padding:5px 9px; } .ax small { display:none; }
    body.axo #axo-barra { left:8px; right:8px; max-width:calc(100% - 16px); bottom:8px; }
  }
  /* E10 (Pipe, 8-nov: «me gustaria tener las burbujas de los espacios para revisar la geometria ahi»): fila de circulos como la del 360, encima de la barra de escenas y a la izquierda de la planta */
  #burbujas { position:fixed; left:10px; right:220px; bottom:60px; overflow-x:auto; overflow-y:hidden; scrollbar-width:none; pointer-events:none; }
  #burbujas::-webkit-scrollbar { display:none; }
  #burbujas.oculta { display:none; }
  #burb-fila { display:flex; width:max-content; margin:0 auto; padding:26px 40px 24px; gap:8px; }
  .mn, .mn.on { position:relative; flex:none; width:52px; height:52px; padding:0; border-radius:50%; background:#2A2826; border:2.5px solid #fff; box-shadow:0 1px 8px rgba(0,0,0,.45); pointer-events:auto; touch-action:pan-x; transition:transform .12s; }
  .mn canvas { display:block; width:100%; height:100%; border-radius:50%; }
  .mn.on { border-color:var(--acento); box-shadow:0 0 0 2px #fff, 0 1px 8px rgba(0,0,0,.45); }
  .mn .nom { display:none; position:absolute; left:50%; bottom:calc(100% + 6px); transform:translateX(-50%); font-size:11.5px; line-height:1.5; color:#fff; background:rgba(30,28,26,.82); padding:0 8px; border-radius:8px; white-space:nowrap; font-weight:400; }
  .mn.on .nom { display:block; top:calc(100% + 6px); bottom:auto; background:var(--acento); }
  .mn:focus-visible { outline:2px solid #fff; outline-offset:2px; }
  @media (hover:hover) { .mn:hover { transform:scale(1.07); } .mn:hover .nom { display:block; } }
  body.en-recinto #lienzo { cursor:grab; }
  body.axo #burbujas { display:none !important; }
  @media (max-width:700px) { #burbujas { left:8px; right:8px; bottom:50px; } .mn, .mn.on { width:44px; height:44px; } #burb-fila { gap:8px; } }
  #vistas2 { display:none; }
  @media (pointer:coarse) { #b-pie { display:none; } }          /* caminar pide teclado y raton: en pantallas tactiles se oculta (pendiente) */
  @media (max-width:700px) {
    #herr { top:8px; left:8px; } #herr #vistas, #herr .sep { display:none; } #vistas2 { display:flex; margin-top:8px; } #panel { top:auto; bottom:70px; left:8px; width:calc(100% - 16px); max-height:50%; }
    #ficha { width:calc(100% - 16px); right:8px; top:auto; bottom:70px; max-height:50%; overflow:auto; }
    #planta { display:none; } #escenas { bottom:8px; } #escenas button { padding:7px 12px; font-size:12px; } #hud { bottom:70px; }
  }
</style>

<body>

<script type="module">
import * as THREE from 'three';
import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';
import { MeshoptDecoder } from 'three/addons/libs/meshopt_decoder.module.js';   // publicable: GLB comprimidos
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { PointerLockControls } from 'three/addons/controls/PointerLockControls.js';

const DIAG = /[?&]diag=1/.test(location.search);
const publica = r => DIAG || !['Pieza', 'Fuente', 'Ojo'].includes(r[0]);
const BASE = 'modelo/';  // Visor VIRTU v1: consume el modelo de IW1 sin copiarlo (174 MB)
const t0 = performance.now();
const IW = window.IW = { stats: {}, capas: {}, listo: false, THREE };
const $ = (s) => document.querySelector(s);

// ---------------------------------------------------------------- escena
const lienzo = $('#lienzo');
const renderer = new THREE.WebGLRenderer({ canvas: lienzo, antialias: true, powerPreference: 'high-performance' });
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 1.5));
renderer.setSize(innerWidth, innerHeight);
renderer.toneMapping = THREE.ACESFilmicToneMapping; renderer.toneMappingExposure = 0.9;
renderer.shadowMap.enabled = true; renderer.shadowMap.type = THREE.PCFSoftShadowMap; renderer.shadowMap.autoUpdate = false;
const scene = new THREE.Scene();
scene.background = new THREE.Color(0xc9dbe8);
scene.fog = new THREE.Fog(0xc9dbe8, 120, 420);
const camara = new THREE.PerspectiveCamera(50, innerWidth / innerHeight, 0.3, 1500);
let camActiva = camara;          // Visor VIRTU E4: en axonometria se dibuja con la camara ortografica
const CENTRO = new THREE.Vector3(4.0, 1.5, -17.0);     // casa: x de 0 a 8 m, y (Max) de 0 a 35 m
camara.position.set(-15, 7.5, 10);
const hemi = new THREE.HemisphereLight(0xe8f0f7, 0x7d7a62, 1.1); scene.add(hemi);
const amb = new THREE.AmbientLight(0xfff6ea, 0.9); scene.add(amb);   // relleno para el interior (sin GI en el navegador)
const sol = new THREE.DirectionalLight(0xfff3e2, 3.0);
sol.castShadow = true; sol.shadow.mapSize.set(2048, 2048);
Object.assign(sol.shadow.camera, { left: -32, right: 32, top: 32, bottom: -32, near: 1, far: 200 });
sol.shadow.bias = -0.0004; sol.shadow.normalBias = 0.03;
scene.add(sol); scene.add(sol.target); sol.target.position.copy(CENTRO);
function ponerSol(v) {           // 0..100: de la mañana (este) a la tarde (oeste), altura de arco simple
  const a = (v / 100) * Math.PI;  const elev = 0.25 + 0.75 * Math.sin(a);
  const dir = new THREE.Vector3(Math.cos(a), 0, 0);                      // a = 0: este (x+); a = pi: oeste
  dir.z = 0.55; dir.y = elev * 1.4; dir.normalize();                     // el sol va por el sur (z+ de three = sur)
  sol.position.copy(CENTRO).addScaledVector(dir, 80);
  renderer.shadowMap.needsUpdate = true;
}
ponerSol(38);

const ORB = { min: 6, max: 100 };   // metros de la camara al punto de giro: mas cerca se entra a los muros (adentro es A pie); mas lejos se ve el borde del terreno
const orbita = new OrbitControls(camara, lienzo);
orbita.target.copy(CENTRO); orbita.enableDamping = true; orbita.maxPolarAngle = Math.PI * 0.495; orbita.minDistance = ORB.min; orbita.maxDistance = ORB.max; orbita.update();
const pie = new PointerLockControls(camara, document.body);
const acotar = (v, a, b) => Math.max(a, Math.min(b, v));
function ajustarCerca() { const n = acotar(camara.position.distanceTo(orbita.target) * .01, .1, 2); if (Math.abs(n - camara.near) > .004) { camara.near = n; camara.updateProjectionMatrix(); } }
// OrbitControls ignora la rueda mientras un boton esta apretado: aqui se atiende ese caso, con la misma escala y los mismos topes
let orbitando = false, tAvisoCerca = -1e9; lienzo.addEventListener('pointerdown', () => { orbitando = true; }); for (const ev of ['pointerup', 'pointercancel']) addEventListener(ev, () => { orbitando = false; });
lienzo.addEventListener('wheel', e => {
  if (modo !== 'orbita' && !IW.modoAxo) return;
  if (orbitando) { e.preventDefault(); const k = Math.pow(.95, Math.abs(e.deltaY) * .01), f = e.deltaY < 0 ? k : 1 / k;
    if (IW.modoAxo) { camAxo.zoom = acotar(camAxo.zoom / f, orbitaAxo.minZoom, orbitaAxo.maxZoom); camAxo.updateProjectionMatrix(); }
    else { const v = camara.position.clone().sub(orbita.target), d = acotar(v.length() * f, ORB.min, ORB.max); camara.position.copy(orbita.target).addScaledVector(v.normalize(), d); } }
  else if (!IW.modoAxo && e.deltaY < 0 && camara.position.distanceTo(orbita.target) <= ORB.min + .2 && performance.now() - tAvisoCerca > 20000) { tAvisoCerca = performance.now(); aviso('Para entrar a la casa, usa A pie.', 4000); }
}, { passive: false });
Object.assign(IW, { renderer, scene, camara, orbita });
IW.medir = (n = 30) => {           // tiempo de render sin depender del requestAnimationFrame (el panel oculto lo frena)
  const gl = renderer.getContext(); renderer.render(scene, camActiva); gl.finish();
  const t = performance.now(); for (let i = 0; i < n; i++) { if (modo === 'pie') mover(1 / 60); else if (IW.modoAxo) IW.orbitaAxo.update(); else orbita.update(); renderer.render(scene, camActiva); } gl.finish();
  const ms = (performance.now() - t) / n; const inf = renderer.info.render;
  return { ms_por_cuadro: +ms.toFixed(2), cps_equivalentes: +(1000 / ms).toFixed(1), llamadas: inf.calls, triangulos: inf.triangles };
};

// ---------------------------------------------------------------- manifiesto y carga
const man = await (await fetch(BASE + 'manifiesto.json')).json();
IW.manifiesto = man;
let catalogo = null;
if (man.catalogo_productos) { try { catalogo = await (await fetch(BASE + man.catalogo_productos)).json(); } catch (e) { catalogo = null; } }
const loader = new GLTFLoader(); loader.setMeshoptDecoder(MeshoptDecoder);
THREE.Cache.enabled = true;
const pesoIni = man.capas.filter(c => c.inicial).reduce((s, c) => s + c.bytes + c.bytes_texturas, 0);
let cargadoIni = 0;

// Visor VIRTU (Pipe, 7-nov: «la textura roja del piso no juega bien, se que es tierra pero para efectos de la representacion
// puedes ponerla verde como el pasto?»): el piso del bosque (SIT-TERRENO|WUE-tierra-mantillo) se dibuja con el material del
// cesped, a su misma escala real (cesped: 1,85 m por repeticion en sus UV; mantillo: 0,94 m). Solo en el visor; ?suelo=tierra
// muestra el mantillo original. La jardinera de corteza del patio conserva su material.
const SUELO_TIERRA = new URLSearchParams(location.search).get('suelo') === 'tierra';
const SUELO = { cesped_m: 1.85, mantillo_m: 0.94 };
function sueloVerde(g) {
  let cesped = null; const piso = [], sombra = [];
  g.traverse(o => { if (!o.isMesh) return;
    if (o.material.name === 'WUE-cesped') cesped = o.material;
    if (o.name.startsWith('SIT-TERRENO|') && o.material.name === 'WUE-tierra-mantillo') piso.push(o);
    if (o.material.name === 'WUE-r22-mantillo-sombra') sombra.push(o); });
  if (!cesped || !piso.length) return;
  const m = cesped.clone(); m.name = 'VIRTU-piso-bosque-cesped';
  if (cesped.map) { m.map = cesped.map.clone(); m.map.wrapS = m.map.wrapT = THREE.RepeatWrapping; const k = SUELO.mantillo_m / SUELO.cesped_m; m.map.repeat.set(k, k); m.map.needsUpdate = true; }
  for (const o of piso) o.material = m;

}
function armarRT2(m, cat) {
  RT2.modelo = m; RT2.cat = cat; RT2.capas = []; RT2.subs = Object.fromEntries(m.subsistemas.map(s => [s.id, s.nombre]));

  const geoT = new THREE.CylinderGeometry(1, 1, 1, 8, 1), geoA = new THREE.SphereGeometry(1, 10, 6), geoE = new THREE.BoxGeometry(1, 1, 1);

    const id = 'RT2-' + capa.sistema, g = new THREE.Group(); g.name = id;
    const tr = m.tramos.filter(t => t.capa === capa.id && t.fisico !== false).concat(...m.campo_radiante.filter(c => c.capa === capa.id).map(serpentin));
    const ac = m.accesorios.filter(a => a.capa === capa.id), eq = m.equipos.filter(e => e.capa === capa.id), te = m.terminales.filter(t => t.capa === capa.id && t.pos);
    const mat = new THREE.MeshStandardMaterial({ color: 0xffffff, roughness: 0.55, metalness: 0.05 });
    const matE = new THREE.MeshStandardMaterial({ color: 0xffffff, roughness: 0.7, transparent: true, opacity: 0.88 });

    for (const mm of mats) mm.userData.base = { opacity: mm.opacity, transparent: mm.transparent, depthWrite: true, emissive: mm.emissive.clone(), color: mm.color.clone(), map: null };
    const hacer = (geo, mtl, items, poner) => {
      if (!items.length) return null;
      const im = new THREE.InstancedMesh(geo, mtl, items.length); im.userData = { capaId: id, rt2: items, colores: [] };
      items.forEach((it, i) => { poner(it); im.setMatrixAt(i, M); const col = tono(capa.color, TONO_SUB[it.subsistema] || 0); im.setColorAt(i, col); im.userData.colores.push(col); });
      im.instanceMatrix.needsUpdate = true; im.instanceColor.needsUpdate = true; im.computeBoundingSphere(); im.castShadow = false; im.receiveShadow = true;
      g.add(im); RT2.mallas.push(im); return im;
    };
    const tubos = hacer(geoT, mat, tr, t => { const a = X3(t.a), b = X3(t.b), d = b.clone().sub(a), L = Math.max(d.length(), 0.001), r = Math.max((t.d_ext_m || 0.012) / 2, 0.004);
      Q.setFromUnitVectors(Y, d.normalize()); M.compose(a.add(b).multiplyScalar(0.5), Q, S.set(r, L, r)); });
    if (tubos) tubos.userData.esTubo = true;

    hacer(geoE, matE, eq, e => { const lo = X3(e.caja_lo), hi = X3(e.caja_hi), c = lo.clone().add(hi).multiplyScalar(0.5);

    const def = { id, nombre: (NOMBRE_RED[capa.sistema] || capa.sistema_nombre) + ' (calculada)', grupo: 'redes', color: capa.color, sistema: capa.sistema, sistema_nombre: capa.sistema_nombre,

    man.capas.push(def); g.visible = false; g.userData.capa = def; scene.add(g);
    IW.capas[id] = { def, grupo: g, mats, opacidad: 1 }; RT2.capas.push(id);
    const f = document.createElement('div'); f.className = 'fila';
    f.innerHTML = `<input type="checkbox" id="cb-${id}"><span class="chip" style="background:${capa.color}"></span><label for="cb-${id}">${def.nombre}</label><span class="mb">${tr.length} tramos</span>`;
    f.querySelector('input').addEventListener('change', e => { def.visible = e.target.checked; g.visible = e.target.checked; });
    filaRedes.appendChild(f);
  }
  RT2.listo = true; IW.fuenteRedes = 'rt2'; document.querySelector('#fuente-rt2').checked = true; document.querySelector('#fuente-caja').style.display = '';
  RT2.resumen = { tramos: m.tramos.length, accesorios: m.accesorios.length, equipos: m.equipos.length, terminales: m.terminales.length, campo: m.campo_radiante.length, productos: Object.keys(cat).length };
  if (ESTADO.escena === 'redes') ponerEscena('redes');
  if (IW.modoAxo && IW.axoActual) aplicarAxo(IW.axoActual);
}
function cargarRT2() {
  Promise.all([fetch(RT2_URL).then(r => r.json()), fetch(CAT_URL).then(r => r.json())])
    .then(([m, cat]) => armarRT2(m, cat)).catch(err => { RT2.error = String(err); });
}
function ponerFuente(f) {
  IW.fuenteRedes = f; for (const id of todasRedes()) capaVisible(id, false);
  if (IW.modoAxo && IW.axoActual) aplicarAxo(IW.axoActual); else if (ESTADO.escena === 'redes') ponerEscena('redes');
  aviso(f === 'rt2' ? 'Redes calculadas, como propuesta: tramos con su diámetro y producto; equipos como cajas.' : 'Redes como se dibujaron en el modelo.', 5000);
}
document.querySelectorAll('input[name=fuente]').forEach(r => r.addEventListener('change', e => ponerFuente(e.target.value)));
IW.ponerFuente = ponerFuente;
// ficha de una pieza RT2
const etiquetaEstado = e => ({ 'PROPUESTA': 'propuesta', 'DATO-FABRICANTE': 'dato del fabricante' })[e] || (/^D\d|^DATO/.test(e || '') ? 'dato de la réplica' : e);
function productoTexto(pid) { const p = RT2.cat[pid]; if (!p) return pid ? 'sin ficha en el catálogo' : '—';
  return `${p.marca || ''} ${p.modelo || ''}`.trim() + ` <span style="color:var(--suave)">[${pid}]</span>` + (p.ficha_url ? ` · <a href="${p.ficha_url}" target="_blank" rel="noopener">ficha ↗</a>` : ''); }
function fichaRT2(h) {
  const o = h.object, it = o.userData.rt2[h.instanceId], L = IW.capas[o.userData.capaId]; const b = new THREE.Box3();
  let tipo, medidas;
  if (it.a) { const r = Math.max((it.d_ext_m || 0.012) / 2, 0.004); b.setFromPoints([X3(it.a), X3(it.b)]).expandByScalar(r);
    tipo = (it.tipo_tramo || 'tramo') + (it.rol ? ' · ' + it.rol : '') + (it.soporte ? ' · por ' + it.soporte : '') + (it.campo ? ' · circuito ' + it.circuito + ' (' + it.zona + ')' : '');
    medidas = `Ø ext ${(it.d_ext_m * 1000).toFixed(1)} mm · ${(it.largo_m || X3(it.a).distanceTo(X3(it.b))).toFixed(2)} m`; }
  else if (it.caja_lo) { b.setFromPoints([X3(it.caja_lo), X3(it.caja_hi)]); tipo = 'equipo' + (it.objeto_central ? ' · pieza ' + it.objeto_central : '');
    medidas = (it.dims_m || []).map(v => (v * 1000).toFixed(0)).join(' × ') + ' mm'; }
  else if (it.punto !== undefined) { b.setFromCenterAndSize(X3(it.pos), new THREE.Vector3(0.07, 0.07, 0.07)); tipo = 'punto de consumo · ' + it.tipo + (it.circuito ? ' · circuito ' + it.circuito : ''); medidas = 'marca de 7 cm (el aparato está en el modelo)'; }
  else { const r = 0.6 * (it.d_in || 0.5) * 0.0254 + 0.004; b.setFromCenterAndSize(X3(it.pos), new THREE.Vector3(2 * r, 2 * r, 2 * r)); tipo = 'accesorio · ' + it.tipo; medidas = `Ø ${it.d_in}"`; }
  caja.box.copy(b); caja.visible = true;
  const fil = [['Pieza', it.id], ['Red', (L ? L.def.nombre : '') + (it.subsistema ? ' · ' + (RT2.subs[it.subsistema] || it.subsistema) : '')], ['Tipo', tipo], ['Producto', productoTexto(it.producto)],
    ['Medidas', medidas], ['Estado', etiquetaEstado(it.estado)]];

  $('#ficha').innerHTML = '<div class="t"><span>Ficha de la red</span><button id="ficha-x" title="Cerrar">×</button></div><table>' + fil.filter(publica).map(r => `<tr><td>${r[0]}</td><td>${r[1]}</td></tr>`).join('') + '</table>' +
    (window.parent !== window && it.producto ? `<div style="margin-top:6px"><span class="enlace" id="ficha-prod">Ver en Productos →</span></div>` : '');

IW.fichaRT2 = fichaRT2;
// resaltar todas las piezas de un producto (lo pide el modulo Productos): las demas quedan tenues
function resaltarProducto(pid) {
  if (!RT2.listo) { setTimeout(() => resaltarProducto(pid), 300); return; }
  if (IW.modoAxo) modoAxo(false);
  if (IW.fuenteRedes !== 'rt2') { document.querySelector('#fuente-rt2').checked = true; IW.fuenteRedes = 'rt2'; }
  ponerEscena('redes');
  quitarResalte();
  const b = new THREE.Box3(), M = new THREE.Matrix4(), bi = new THREE.Box3(), resalte = new THREE.Color(0xff5a00); let n = 0;
  const P0 = new THREE.Vector3(), Q0 = new THREE.Quaternion(), S0 = new THREE.Vector3();
  for (const im of RT2.mallas) { im.geometry.computeBoundingBox(); im.userData.m0 = im.userData.m0 || im.instanceMatrix.array.slice();
    im.userData.rt2.forEach((it, i) => { const si = it.producto === pid;
      im.setColorAt(i, si ? resalte : im.userData.colores[i].clone().lerp(new THREE.Color(0xd9d4cc), 0.75));
      if (si) { n++; im.getMatrixAt(i, M); bi.copy(im.geometry.boundingBox).applyMatrix4(M); b.union(bi);
        M.decompose(P0, Q0, S0);            // mientras dura el resalte, los tubos finos se ven de 5 cm y los puntos de 8 cm
        if (im.userData.esTubo) { S0.x = S0.z = Math.max(S0.x, 0.025); } else if (im.geometry.type === 'SphereGeometry') S0.setScalar(Math.max(S0.x, 0.04));
        M.compose(P0, Q0, S0); im.setMatrixAt(i, M); } });
    im.instanceColor.needsUpdate = true; im.instanceMatrix.needsUpdate = true; }
  RT2.resaltado = pid;
  // las piezas del central (equipos de D12) con ese producto
  const p = RT2.cat[pid] || {};
  if (n) { const c = b.getCenter(new THREE.Vector3()), r = Math.max(4, b.getSize(new THREE.Vector3()).length() * 0.62);
    ponerModo('orbita'); camara.position.set(c.x - 0.7 * r, c.y + 0.75 * r, c.z + 0.6 * r); orbita.target.copy(c); orbita.update(); }
  aviso(n ? `${n} piezas de ${(p.marca || '') + ' ' + (p.modelo || pid)} en naranja. «Arquitectura» o «Redes» quita el resalte.` : `${p.modelo || pid}: no tiene piezas dibujadas en las redes.`, 9000);

function quitarResalte() { if (!RT2.resaltado) return; RT2.resaltado = null;

IW.resaltarProducto = resaltarProducto;

// ---------------------------------------------------------------- E10: burbujas por recinto (datos: preparar_burbujas_recintos.py)
// Pipe, 8-nov: «me gustaria tener las burbujas de los espacios para revisar la geometria ahi». Clic: la camara queda dentro del espacio, a 1,60 m del piso.
const RECINTOS_JSON = 'recintos3d/recintos3d_v3q_b.json';
let recintos = [], miniPend = false;
IW.recintos = () => recintos;
IW.recintoActual = () => recintoAct;
function irRecinto(q) {
  if (IW.modoAxo) modoAxo(false);
  if (pie.isLocked) pie.unlock();
  ponerModo('pie', { x: q.x, z: -q.y, mira: -q.y - 1, recinto: q });
  yPie = q.piso; velY = 0;
  const a = THREE.MathUtils.degToRad(q.az);
  camara.position.set(q.x, yPie + 1.6, -q.y);
  camara.lookAt(q.x + Math.sin(a), yPie + 1.6, -q.y - Math.cos(a));
  const b = BURB.get(q.id); if (b) { const c = $('#burbujas'); c.scrollTo({ left: b.offsetLeft + b.offsetWidth / 2 - c.clientWidth / 2, behavior: 'smooth' }); }
  aviso(q.nombre + (matchMedia('(pointer:coarse)').matches ? ': arrastra para mirar; toca una pieza para ver su ficha con medidas.' : ': arrastra para mirar, W A S D para caminar, clic en una pieza para ver su ficha con medidas.'), 6000);
}
IW.irRecinto = (id) => { const q = recintos.find(r => r.id === id); if (q) irRecinto(q); return !!q; };
// las miniaturas se dibujan aqui mismo desde el modelo cargado: si el modelo cambia, cambian con el
function pintarMiniaturas() {
  miniPend = false; if (!recintos.length || IW.modoAxo) return 0;
  const W = 104, sz = renderer.getSize(new THREE.Vector2()), pr = renderer.getPixelRatio(), cam = new THREE.PerspectiveCamera(78, 1, 0.05, camara.far);

    cam.position.set(q.x, q.piso + 1.6, -q.y); cam.lookAt(q.x + Math.sin(a), q.piso + 1.6, -q.y - Math.cos(a)); cam.updateMatrixWorld(); renderer.render(scene, cam);
    const b = BURB.get(q.id); if (b) b.querySelector('canvas').getContext('2d').drawImage(lienzo, 0, 0, W, W); }

IW.pintarMiniaturas = pintarMiniaturas;
fetch(RECINTOS_JSON).then(r => r.ok ? r.json() : null).then(d => {
  if (!d) return; recintos = d.burbujas; IW.datosRecintos = d;
  for (const q of recintos) { const b = document.createElement('button'); b.className = 'mn'; b.setAttribute('aria-label', q.nombre); b.dataset.id = q.id;
    b.innerHTML = `<canvas width="104" height="104"></canvas><span class="nom">${q.nombre}</span>`;
    b.onclick = (e) => { irRecinto(q); if (e.detail) b.blur(); }; $('#burb-fila').appendChild(b); BURB.set(q.id, b); }
  if (IW.stats.carga_inicial_s) miniPend = true;
}).catch(() => {});
$('#burbujas').addEventListener('wheel', e => { const c = $('#burbujas'); if (c.scrollWidth > c.clientWidth) { c.scrollLeft += e.deltaY || e.deltaX; e.preventDefault(); } }, { passive: false });
$('#b-burb').onclick = () => { const o = $('#burbujas').classList.toggle('oculta'); $('#b-burb').classList.toggle('on', !o); };
// dentro de una burbuja: arrastrar para mirar, en el mismo sentido que el 360
let arrMira = null; const eMira = new THREE.Euler(0, 0, 0, 'YXZ');

addEventListener('pointermove', e => { if (!arrMira || !recintoAct) return; const k = THREE.MathUtils.degToRad(camara.fov) / lienzo.clientHeight;
  eMira.setFromQuaternion(camara.quaternion); eMira.y += (e.clientX - arrMira[0]) * k; eMira.x = Math.max(-1.45, Math.min(1.45, eMira.x + (e.clientY - arrMira[1]) * k));

for (const id of REDES) capaVisible(id, false);      // escena inicial "Arquitectura": las redes bajan en segundo plano pero quedan ocultas
$('#pers-t').textContent = $('#pers').value;
const prog = {};

await Promise.all(ini.map(c => cargarCapa(c, (e) => { prog[c.id] = e.loaded; const s = Object.values(prog).reduce((a, b) => a + b, 0);
  $('#barra i').style.width = Math.min(100, 100 * s / pesoIni) + '%'; })));
renderer.shadowMap.needsUpdate = true;
requestAnimationFrame(bucle);
IW.stats.carga_inicial_s = +((performance.now() - t0) / 1000).toFixed(1);
$('#carga').style.display = 'none';
miniPend = true;            // miniaturas con la arquitectura; se repiten cuando llega el mobiliario
// v3p: se ven las redes del central (capas RED-*); la propuesta RT2 anterior no se carga para no taparlas
for (const c of resto) await cargarCapa(c);
IW.stats.carga_total_s = +((performance.now() - t0) / 1000).toFixed(1);
miniPend = true;
IW.listo = true;
